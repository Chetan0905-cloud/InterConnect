<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Find Support | InterConnect</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="dashboard-page">


    <!-- NAVBAR -->

    <nav class="dashboard-nav">

        <a
            href="index.html"
            class="dashboard-logo"
        >

            <span class="logo-icon">
                ◎
            </span>

            InterConnect

        </a>


        <div class="dashboard-nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a
                href="supporters.html"
                class="active"
            >
                Find Support
            </a>

            <a href="messages.html">
                Messages
            </a>

            <a href="profile.html">
                Profile
            </a>

        </div>


        <button
            id="logoutBtn"
            class="logout-btn"
        >
            Logout
        </button>

    </nav>



    <!-- MAIN -->

    <main class="supporters-container">


        <section class="supporters-heading">

            <p class="small-title">
                INTERCONNECT SUPPORT
            </p>

            <h1>
                Find someone who can help.
            </h1>

            <p>
                Explore available supporters and connect
                with someone who matches what you're
                looking for.
            </p>

        </section>



        <!-- FILTERS -->

        <section class="support-filters">


            <div>

                <label for="supportType">
                    Support type
                </label>

                <select id="supportType">

                    <option value="all">
                        All support
                    </option>

                    <option value="psychology">
                        Psychology Student
                    </option>

                    <option value="peer">
                        Peer Supporter
                    </option>

                    <option value="professional">
                        Professional Support
                    </option>

                </select>

            </div>



            <div>

                <label for="availability">
                    Availability
                </label>

                <select id="availability">

                    <option value="all">
                        Any availability
                    </option>

                    <option value="available">
                        Available now
                    </option>

                </select>

            </div>


        </section>



        <!-- SUPPORTER CARDS -->

        <section
            class="supporters-grid"
            id="supportersGrid"
        >

            <p>
                Loading supporters...
            </p>

        </section>


    </main>



    <script>


        // =====================================================
        // LOGGED-IN USER
        // =====================================================

        const userData =
            JSON.parse(
                localStorage.getItem(
                    "interconnectUser"
                )
            );


        console.log(
            "Logged-in user:",
            userData
        );


        // =====================================================
        // LOGIN CHECK
        // =====================================================

        if (!userData || !userData.id) {

            window.location.href =
                "login.html";

        }



        // =====================================================
        // LOGOUT
        // =====================================================

        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                function () {

                    localStorage.removeItem(
                        "interconnectUser"
                    );

                    window.location.href =
                        "login.html";

                }
            );



        // =====================================================
        // ELEMENTS
        // =====================================================

        const supportersGrid =
            document.getElementById(
                "supportersGrid"
            );


        const supportType =
            document.getElementById(
                "supportType"
            );


        const availability =
            document.getElementById(
                "availability"
            );



        // =====================================================
        // LOAD SUPPORTERS
        // =====================================================

        async function loadSupporters() {

            try {

                const response =
                    await fetch(
                        "https://interconnect-production-9022.up.railway.app/supporters"
                    );


                const result =
                    await response.json();


                console.log(
                    "Supporters response:",
                    result
                );


                if (!response.ok ||
                    !result.success
                ) {

                    supportersGrid.innerHTML = `
                        <p>
                            Unable to load supporters.
                        </p>
                    `;

                    return;

                }


                supportersGrid.innerHTML = "";


                const supporters =
                    result.supporters || [];


                if (supporters.length === 0) {

                    supportersGrid.innerHTML = `
                        <p>
                            No supporters are available
                            right now.
                        </p>
                    `;

                    return;

                }



                // =====================================================
                // CREATE CARDS
                // =====================================================

                supporters.forEach(
                    function (supporter) {


                        const name =
                            supporter.name ||
                            "Supporter";


                        const qualification =
                            supporter.qualification ||
                            "Peer Supporter";


                        const bio =
                            supporter.bio ||
                            "Available to provide support and a listening ear.";


                        const location =
                            supporter.location ||
                            "Available online";


                        const availabilityValue =
                            supporter.availability ||
                            "Available";


                        const isAvailable =
                            availabilityValue
                                .toLowerCase() ===
                            "available";


                        // Determine card type

                        let cardType =
                            "peer";


                        if (
                            qualification
                                .toLowerCase()
                                .includes(
                                    "psychology"
                                )
                        ) {

                            cardType =
                                "psychology";

                        }


                        if (
                            qualification
                                .toLowerCase()
                                .includes(
                                    "professional"
                                )
                        ) {

                            cardType =
                                "professional";

                        }



                        // Create card

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "supporter-profile-card";


                        card.dataset.type =
                            cardType;


                        card.dataset.available =
                            isAvailable
                                ? "available"
                                : "unavailable";



                        const firstLetter =
                            name
                                .charAt(0)
                                .toUpperCase();



                        card.innerHTML = `

                            <div class="profile-top">

                                <div class="large-avatar">
                                    ${firstLetter}
                                </div>

                                ${
                                    isAvailable
                                    ?
                                    `
                                    <span
                                        class="available-badge"
                                    >
                                        ● Available
                                    </span>
                                    `
                                    :
                                    `
                                    <span
                                        class="available-badge"
                                    >
                                        ● Unavailable
                                    </span>
                                    `
                                }

                            </div>


                            <h2>
                                ${name}
                            </h2>


                            <p class="supporter-role">
                                ${qualification}
                            </p>


                            <p class="supporter-description">
                                ${bio}
                            </p>


                            <div class="support-tags">

                                <span>
                                    ${location}
                                </span>

                                <span>
                                    ${
                                        isAvailable
                                        ?
                                        "Available"
                                        :
                                        "Currently unavailable"
                                    }
                                </span>

                            </div>


                            <button
                                class="connect-btn"
                                data-id="${supporter.id}"
                                data-name="${name}"
                            >
                                Connect →
                            </button>

                        `;


                        supportersGrid.appendChild(
                            card
                        );

                    }
                );



                attachConnectButtons();

                filterSupporters();


            } catch (error) {

                console.error(
                    "Error loading supporters:",
                    error
                );


                supportersGrid.innerHTML = `
                    <p>
                        Unable to connect to the server.
                    </p>
                `;

            }

        }



        // =====================================================
        // FILTER SUPPORTERS
        // =====================================================

        function filterSupporters() {

            const selectedType =
                supportType.value;


            const selectedAvailability =
                availability.value;


            const supporterCards =
                document.querySelectorAll(
                    ".supporter-profile-card"
                );


            supporterCards.forEach(
                function (card) {


                    const cardType =
                        card.dataset.type;


                    const cardAvailability =
                        card.dataset.available;


                    const typeMatch =
                        selectedType === "all" ||
                        selectedType === cardType;


                    const availabilityMatch =
                        selectedAvailability === "all" ||
                        selectedAvailability ===
                            cardAvailability;


                    if (
                        typeMatch &&
                        availabilityMatch
                    ) {

                        card.style.display =
                            "block";

                    } else {

                        card.style.display =
                            "none";

                    }

                }
            );

        }



        supportType.addEventListener(
            "change",
            filterSupporters
        );


        availability.addEventListener(
            "change",
            filterSupporters
        );



        // =====================================================
        // CONNECT BUTTONS
        // =====================================================

        function attachConnectButtons() {


            document
                .querySelectorAll(
                    ".connect-btn"
                )
                .forEach(
                    function (button) {


                        button.addEventListener(
                            "click",
                            async function () {


                                const supporterId =
                                    button.dataset.id;


                                const supporterName =
                                    button.dataset.name;



                                // Check login

                                if (
                                    !userData ||
                                    !userData.id
                                ) {

                                    alert(
                                        "Please login first."
                                    );

                                    window.location.href =
                                        "login.html";

                                    return;

                                }



                                const seekerId =
                                    userData.id;



                                // Prevent self-request

                                if (
                                    String(seekerId) ===
                                    String(supporterId)
                                ) {

                                    alert(
                                        "You cannot send a request to yourself."
                                    );

                                    return;

                                }



                                // Disable while sending

                                button.disabled =
                                    true;

                                button.innerText =
                                    "Sending...";



                                try {


                                    const response =
                                        await fetch(
                                            "https://interconnect-production-9022.up.railway.app/support-requests",
                                            {
                                                method:
                                                    "POST",

                                                headers: {
                                                    "Content-Type":
                                                        "application/json"
                                                },

                                                body:
                                                    JSON.stringify({

                                                        seeker_id:
                                                            Number(
                                                                seekerId
                                                            ),

                                                        supporter_id:
                                                            Number(
                                                                supporterId
                                                            ),

                                                        message:
                                                            "I would like to connect with you for support."

                                                    })
                                            }
                                        );



                                    const result =
                                        await response.json();


                                    console.log(
                                        "Support request response:",
                                        result
                                    );



                                    if (
                                        response.ok &&
                                        result.success
                                    ) {

                                        alert(
                                            "Connection request sent to " +
                                            supporterName +
                                            "!"
                                        );


                                        button.innerText =
                                            "Request Sent ✓";


                                    } else {


                                        button.disabled =
                                            false;


                                        button.innerText =
                                            "Connect →";


                                        alert(
                                            result.message ||
                                            "Unable to send request."
                                        );

                                    }


                                } catch (error) {


                                    console.error(
                                        "Send request error:",
                                        error
                                    );


                                    button.disabled =
                                        false;


                                    button.innerText =
                                        "Connect →";


                                    alert(
                                        "Unable to connect to the server."
                                    );

                                }

                            }
                        );

                    }
                );

        }



        // =====================================================
        // START
        // =====================================================

        loadSupporters();


    </script>


</body>

</html>
