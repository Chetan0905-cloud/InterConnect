<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Support Requests | InterConnect
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="dashboard-page">


    <!-- NAVBAR -->

    <nav class="dashboard-nav">


        <a
            href="index.html"
            class="dashboard-logo"
        >

            <span class="logo-icon">
                ◎
            </span>

            InterConnect

        </a>



        <div class="dashboard-nav-links">


            <a
                href="supporter-dashboard.html"
            >
                Dashboard
            </a>


            <a
                href="requests.html"
                class="active"
            >
                Requests
            </a>


            <a href="messages.html">
                Messages
            </a>


            <a href="profile.html">
                Profile
            </a>


        </div>



        <button
            id="logoutBtn"
            class="logout-btn"
        >
            Logout
        </button>


    </nav>



    <!-- MAIN -->

    <main class="dashboard-container">


        <section class="dashboard-welcome">


            <div>

                <p class="small-title">
                    SUPPORT REQUESTS
                </p>


                <h1>
                    People Looking for Support 🤝
                </h1>


                <p>
                    Review support requests and choose
                    who you would like to connect with.
                </p>

            </div>


        </section>



        <!-- REQUESTS -->

        <section class="dashboard-section">


            <div class="section-heading">


                <div>

                    <p class="small-title">
                        REQUESTS
                    </p>


                    <h2>
                        Available Support Requests
                    </h2>

                </div>


            </div>



            <div id="requestsContainer">

                <p id="loadingMessage">
                    Loading requests...
                </p>

            </div>


        </section>


    </main>



    <script>


        // =====================================================
        // LOGGED-IN USER
        // =====================================================

        const userData =
            JSON.parse(
                localStorage.getItem(
                    "interconnectUser"
                )
            );


        console.log(
            "Requests page user:",
            userData
        );



        // =====================================================
        // LOGIN CHECK
        // =====================================================

        if (
            !userData ||
            !userData.id
        ) {

            window.location.href =
                "login.html";

        }



        // =====================================================
        // SUPPORTER CHECK
        // =====================================================

        if (
            userData &&
            userData.role &&
            userData.role.toLowerCase() !==
                "supporter"
        ) {

            window.location.href =
                "dashboard.html";

        }



        // =====================================================
        // LOGOUT
        // =====================================================

        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                function () {

                    localStorage.removeItem(
                        "interconnectUser"
                    );

                    window.location.href =
                        "login.html";

                }
            );



        // =====================================================
        // LOAD REQUESTS
        // =====================================================

        async function loadRequests() {


            const container =
                document.getElementById(
                    "requestsContainer"
                );


            container.innerHTML = `
                <p>
                    Loading requests...
                </p>
            `;



            try {


                const response =
                    await fetch(
                        "https://interconnect-production-9022.up.railway.app/support-requests/" +
                        userData.id
                    );


                const result =
                    await response.json();


                console.log(
                    "Requests response:",
                    result
                );



                if (
                    !response.ok ||
                    !result.success
                ) {


                    container.innerHTML = `
                        <div class="dashboard-card">

                            <div class="card-icon">
                                ⚠️
                            </div>

                            <h2>
                                Unable to Load Requests
                            </h2>

                            <p>
                                ${
                                    result.message ||
                                    "Unable to load support requests."
                                }
                            </p>

                        </div>
                    `;

                    return;

                }



                const requests =
                    result.requests || [];



                // No requests

                if (
                    requests.length === 0
                ) {


                    container.innerHTML = `
                        <div class="dashboard-card">

                            <div class="card-icon">
                                📭
                            </div>

                            <h2>
                                No Support Requests Yet
                            </h2>

                            <p>
                                There are currently no
                                support requests available.
                            </p>

                        </div>
                    `;

                    return;

                }



                container.innerHTML = "";



                // =====================================================
                // CREATE REQUEST CARDS
                // =====================================================

                requests.forEach(
                    function (request) {


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "dashboard-card";


                        card.style.marginBottom =
                            "20px";



                        const seekerName =
                            request.seeker_name ||
                            "Support Seeker";


                        const message =
                            request.message ||
                            "Support requested.";


                        const status =
                            request.status ||
                            "Pending";



                        let buttonHTML =
                            "";



                        // Only show buttons for Pending

                        if (
                            status ===
                            "Pending"
                        ) {


                            buttonHTML = `

                                <button
                                    class="dashboard-btn"
                                    onclick="acceptRequest(${request.id})"
                                >
                                    Accept Request →
                                </button>


                                <button
                                    class="dashboard-btn"
                                    style="margin-left:10px;"
                                    onclick="rejectRequest(${request.id})"
                                >
                                    Reject
                                </button>

                            `;

                        }


                        else if (
                            status ===
                            "Accepted"
                        ) {


                            buttonHTML = `

                                <p>
                                    <strong>
                                        ✓ Connection accepted
                                    </strong>
                                </p>

                            `;

                        }


                        else if (
                            status ===
                            "Rejected"
                        ) {


                            buttonHTML = `

                                <p>
                                    <strong>
                                        Request rejected
                                    </strong>
                                </p>

                            `;

                        }



                        card.innerHTML = `

                            <div class="card-icon">
                                🤝
                            </div>


                            <h2>
                                ${seekerName}
                            </h2>


                            <p>
                                ${message}
                            </p>


                            <p>
                                <strong>
                                    Status:
                                </strong>

                                ${status}
                            </p>


                            ${buttonHTML}

                        `;


                        container.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {


                console.error(
                    "Request loading error:",
                    error
                );


                container.innerHTML = `
                    <div class="dashboard-card">

                        <div class="card-icon">
                            ⚠️
                        </div>

                        <h2>
                            Unable to Load Requests
                        </h2>

                        <p>
                            Please make sure the server
                            is running and try again.
                        </p>

                    </div>
                `;

            }

        }



        // =====================================================
        // ACCEPT REQUEST
        // =====================================================

        async function acceptRequest(
            requestId
        ) {


            try {


                const response =
                    await fetch(
                        "https://interconnect-production-9022.up.railway.app/support-requests/" +
                        requestId,
                        {

                            method:
                                "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    status:
                                        "Accepted",

                                    supporter_id:
                                        userData.id

                                })

                        }
                    );



                const result =
                    await response.json();


                console.log(
                    "Accept response:",
                    result
                );



                if (
                    response.ok &&
                    result.success
                ) {


                    alert(
                        "Support request accepted!"
                    );


                    loadRequests();


                } else {


                    alert(
                        result.message ||
                        "Unable to accept request."
                    );

                }


            } catch (error) {


                console.error(
                    "Accept request error:",
                    error
                );


                alert(
                    "Unable to connect to the server."
                );

            }

        }



        // =====================================================
        // REJECT REQUEST
        // =====================================================

        async function rejectRequest(
            requestId
        ) {


            try {


                const response =
                    await fetch(
                        "https://interconnect-production-9022.up.railway.app/support-requests/" +
                        requestId,
                        {

                            method:
                                "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    status:
                                        "Rejected",

                                    supporter_id:
                                        userData.id

                                })

                        }
                    );



                const result =
                    await response.json();



                if (
                    response.ok &&
                    result.success
                ) {


                    alert(
                        "Support request rejected."
                    );


                    loadRequests();


                } else {


                    alert(
                        result.message ||
                        "Unable to reject request."
                    );

                }


            } catch (error) {


                console.error(
                    "Reject request error:",
                    error
                );


                alert(
                    "Unable to connect to the server."
                );

            }

        }



        // =====================================================
        // START
        // =====================================================

        loadRequests();


    </script>


</body>

</html>
