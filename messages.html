<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages | InterConnect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

    <!-- NAVBAR -->

    <nav class="dashboard-nav">

        <a href="index.html" class="dashboard-logo">
            <span class="logo-icon">◎</span>
            InterConnect
        </a>

        <div class="dashboard-nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="supporters.html">
                Find Support
            </a>

            <a href="messages.html" class="active">
                Messages
            </a>

            <a href="profile.html">
                Profile
            </a>

        </div>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </nav>


    <!-- MAIN -->

    <main class="messages-container">

        <section class="messages-header">

            <p class="small-title">
                INTERCONNECT MESSAGES
            </p>

            <h1>
                Your conversations
            </h1>

            <p>
                Connect, talk and take things at your own pace.
            </p>

        </section>


        <section class="messages-layout">

            <!-- =========================
                 CONVERSATIONS
            ========================== -->

            <aside class="conversation-panel">

                <div class="conversation-heading">

                    <h2>
                        Conversations
                    </h2>

                    <span id="conversationCount">
                        0
                    </span>

                </div>


                <div
                    id="conversationList"
                    class="conversation-list"
                >

                    <p
                        id="noConversations"
                        style="padding:20px;"
                    >
                        Loading conversations...
                    </p>

                </div>

            </aside>


            <!-- =========================
                 CHAT
            ========================== -->

            <section class="chat-panel">

                <div class="chat-header">

                    <div class="chat-person">

                        <div
                            class="conversation-avatar"
                            id="chatAvatar"
                        >
                            ?
                        </div>

                        <div>

                            <h2 id="chatName">
                                Select a conversation
                            </h2>

                            <p id="chatRole">
                                Choose someone from your conversations.
                            </p>

                        </div>

                    </div>

                </div>


                <!-- CHAT MESSAGES -->

                <div
                    class="chat-messages"
                    id="chatMessages"
                >

                    <div
                        style="
                            text-align:center;
                            padding:40px;
                            opacity:0.7;
                        "
                    >
                        Select a conversation to start chatting.
                    </div>

                </div>


                <!-- MESSAGE INPUT -->

                <form
                    class="message-input-area"
                    id="messageForm"
                >

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Write a message..."
                        autocomplete="off"
                    >

                    <button type="submit">
                        Send →
                    </button>

                </form>

            </section>

        </section>

    </main>


    <script>

        /* =====================================================
           BACKEND URL
        ===================================================== */

        const API_URL =
            "https://interconnect-production-9022.up.railway.app";


        /* =====================================================
           LOGGED-IN USER
        ===================================================== */

        const currentUser =
            JSON.parse(
                localStorage.getItem(
                    "interconnectUser"
                )
            );


        console.log(
            "Messages page user:",
            currentUser
        );


        /* =====================================================
           LOGIN CHECK
        ===================================================== */

        if (
            !currentUser ||
            !currentUser.id
        ) {

            window.location.href =
                "login.html";

        }


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const conversationList =
            document.getElementById(
                "conversationList"
            );


        const conversationCount =
            document.getElementById(
                "conversationCount"
            );


        const noConversations =
            document.getElementById(
                "noConversations"
            );


        const chatName =
            document.getElementById(
                "chatName"
            );


        const chatRole =
            document.getElementById(
                "chatRole"
            );


        const chatAvatar =
            document.getElementById(
                "chatAvatar"
            );


        const chatMessages =
            document.getElementById(
                "chatMessages"
            );


        const messageForm =
            document.getElementById(
                "messageForm"
            );


        const messageInput =
            document.getElementById(
                "messageInput"
            );


        /* =====================================================
           CURRENT CONVERSATION
        ===================================================== */

        let currentReceiverId = null;


        /* =====================================================
           LOGOUT
        ===================================================== */

        document
            .getElementById("logoutBtn")
            .addEventListener(
                "click",
                function () {

                    localStorage.removeItem(
                        "interconnectUser"
                    );

                    localStorage.removeItem(
                        "selectedConversationUser"
                    );

                    window.location.href =
                        "login.html";

                }
            );


        /* =====================================================
           LOAD ACCEPTED CONNECTIONS
        ===================================================== */

        async function loadConversations() {

            try {

                console.log(
                    "Loading connections for user:",
                    currentUser.id
                );


                const response =
                    await fetch(
                        API_URL +
                        "/connections/" +
                        currentUser.id
                    );


                const result =
                    await response.json();


                console.log(
                    "Connections response:",
                    result
                );


                if (
                    !response.ok ||
                    !result.success
                ) {

                    conversationList.innerHTML = `

                        <p style="padding:20px;">

                            Unable to load conversations.

                            ${
                                result.message ||
                                "Please try again."
                            }

                        </p>

                    `;

                    return;

                }


                const connections =
                    result.connections || [];


                /* REMOVE DUPLICATES */

                const uniqueConnections = [];

                const seenIds = new Set();


                connections.forEach(
                    function (person) {

                        const id =
                            parseInt(
                                person.user_id
                            );


                        if (
                            id &&
                            !seenIds.has(id)
                        ) {

                            seenIds.add(id);

                            uniqueConnections.push(
                                person
                            );

                        }

                    }
                );


                /* UPDATE COUNT */

                conversationCount.textContent =
                    uniqueConnections.length;


                /* CLEAR LIST */

                conversationList.innerHTML =
                    "";


                /* NO CONNECTIONS */

                if (
                    uniqueConnections.length === 0
                ) {

                    conversationList.innerHTML = `

                        <p
                            style="
                                padding:20px;
                                opacity:0.7;
                            "
                        >
                            No accepted conversations yet.
                        </p>

                    `;

                    chatName.textContent =
                        "No conversations yet";

                    chatRole.textContent =
                        "Accept a support request to start messaging.";

                    chatAvatar.textContent =
                        "?";

                    chatMessages.innerHTML = `

                        <div
                            style="
                                text-align:center;
                                padding:40px;
                                opacity:0.7;
                            "
                        >
                            You don't have any accepted
                            connections yet.
                        </div>

                    `;

                    return;

                }


                /* =================================================
                   CREATE CONVERSATION CARDS
                ================================================= */

                uniqueConnections.forEach(
                    function (person) {

                        const conversation =
                            document.createElement(
                                "div"
                            );


                        conversation.className =
                            "conversation";


                        conversation.dataset.id =
                            person.user_id;


                        conversation.dataset.name =
                            person.name ||
                            "User";


                        conversation.dataset.role =
                            person.role ||
                            "InterConnect Member";


                        const firstLetter =
                            person.name
                                ? person.name
                                    .charAt(0)
                                    .toUpperCase()
                                : "?";


                        conversation.innerHTML = `

                            <div
                                class="conversation-avatar"
                            >
                                ${firstLetter}
                            </div>


                            <div
                                class="conversation-info"
                            >

                                <h3>
                                    ${
                                        person.name ||
                                        "User"
                                    }
                                </h3>

                                <p>
                                    ${
                                        person.role ||
                                        "InterConnect Member"
                                    }
                                </p>

                                <span>
                                    Connected on InterConnect
                                </span>

                            </div>


                            <div
                                class="online-dot"
                            ></div>

                        `;


                        conversationList.appendChild(
                            conversation
                        );


                        /* CLICK CONVERSATION */

                        conversation.addEventListener(
                            "click",
                            function () {

                                openConversation(
                                    conversation
                                );

                            }
                        );

                    }
                );


                /* =================================================
                   OPEN SELECTED CONVERSATION
                ================================================= */

                const selectedConversation =
                    JSON.parse(
                        localStorage.getItem(
                            "selectedConversationUser"
                        )
                    );


                if (
                    selectedConversation &&
                    selectedConversation.id
                ) {

                    const matchingConversation =
                        Array.from(
                            conversationList
                                .querySelectorAll(
                                    ".conversation"
                                )
                        ).find(
                            function (conversation) {

                                return (
                                    parseInt(
                                        conversation.dataset.id
                                    ) ===
                                    parseInt(
                                        selectedConversation.id
                                    )
                                );

                            }
                        );


                    if (
                        matchingConversation
                    ) {

                        openConversation(
                            matchingConversation
                        );

                    } else {

                        openConversation(
                            conversationList
                                .querySelector(
                                    ".conversation"
                                )
                        );

                    }


                    localStorage.removeItem(
                        "selectedConversationUser"
                    );

                } else {

                    /* OPEN FIRST CONVERSATION */

                    const firstConversation =
                        conversationList
                            .querySelector(
                                ".conversation"
                            );


                    if (
                        firstConversation
                    ) {

                        openConversation(
                            firstConversation
                        );

                    }

                }

            } catch (error) {

                console.error(
                    "Conversation loading error:",
                    error
                );


                conversationList.innerHTML = `

                    <p style="padding:20px;">

                        Unable to load conversations.

                        Please try again.

                    </p>

                `;

            }

        }


        /* =====================================================
           OPEN CONVERSATION
        ===================================================== */

        function openConversation(
            conversation
        ) {

            if (!conversation) {
                return;
            }


            /* REMOVE ACTIVE */

            document
                .querySelectorAll(
                    ".conversation"
                )
                .forEach(
                    function (item) {

                        item.classList.remove(
                            "active-conversation"
                        );

                    }
                );


            /* ADD ACTIVE */

            conversation.classList.add(
                "active-conversation"
            );


            /* GET USER ID */

            currentReceiverId =
                parseInt(
                    conversation.dataset.id
                );


            /* GET NAME */

            const name =
                conversation.dataset.name ||
                "User";


            /* GET ROLE */

            const role =
                conversation.dataset.role ||
                "InterConnect Member";


            /* UPDATE CHAT HEADER */

            chatName.textContent =
                name;


            chatRole.textContent =
                "🟢 Connected · " +
                role;


            chatAvatar.textContent =
                name
                    ? name
                        .charAt(0)
                        .toUpperCase()
                    : "?";


            /* LOAD MESSAGES */

            loadMessages(
                currentReceiverId
            );

        }


        /* =====================================================
           LOAD MESSAGES
        ===================================================== */

        async function loadMessages(
            receiverId
        ) {

            if (!receiverId) {
                return;
            }


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/messages/" +
                        currentUser.id +
                        "/" +
                        receiverId
                    );


                const result =
                    await response.json();


                console.log(
                    "Messages response:",
                    result
                );


                if (
                    !response.ok ||
                    !result.success
                ) {

                    console.error(
                        result.message ||
                        "Unable to load messages."
                    );

                    return;

                }


                chatMessages.innerHTML =
                    "";


                const messages =
                    result.messages || [];


                /* NO MESSAGES */

                if (
                    messages.length === 0
                ) {

                    chatMessages.innerHTML = `

                        <div
                            style="
                                text-align:center;
                                padding:40px;
                                opacity:0.7;
                            "
                        >
                            No messages yet.
                            Start the conversation.
                        </div>

                    `;

                    return;

                }


                /* DISPLAY MESSAGES */

                messages.forEach(
                    function (message) {

                        const messageDiv =
                            document.createElement(
                                "div"
                            );


                        const type =
                            parseInt(
                                message.sender_id
                            ) ===
                            parseInt(
                                currentUser.id
                            )
                                ? "sent"
                                : "received";


                        messageDiv.className =
                            "message " + type;


                        const date =
                            new Date(
                                message.created_at
                            );


                        const time =
                            date.toLocaleTimeString(
                                [],
                                {
                                    hour:
                                        "2-digit",

                                    minute:
                                        "2-digit"
                                }
                            );


                        const text =
                            document.createElement(
                                "p"
                            );


                        text.textContent =
                            message.message;


                        const timeElement =
                            document.createElement(
                                "span"
                            );


                        timeElement.textContent =
                            time;


                        messageDiv.appendChild(
                            text
                        );


                        messageDiv.appendChild(
                            timeElement
                        );


                        chatMessages.appendChild(
                            messageDiv
                        );

                    }
                );


                /* SCROLL TO BOTTOM */

                chatMessages.scrollTop =
                    chatMessages.scrollHeight;

            } catch (error) {

                console.error(
                    "Unable to load messages:",
                    error
                );

            }

        }


        /* =====================================================
           SEND MESSAGE
        ===================================================== */

        messageForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const text =
                    messageInput.value.trim();


                if (!text) {
                    return;
                }


                if (!currentReceiverId) {

                    alert(
                        "Please select a conversation first."
                    );

                    return;

                }


                try {

                    const response =
                        await fetch(
                            API_URL +
                            "/messages",
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        sender_id:
                                            currentUser.id,

                                        receiver_id:
                                            currentReceiverId,

                                        message:
                                            text

                                    })

                            }
                        );


                    const result =
                        await response.json();


                    console.log(
                        "Send message response:",
                        result
                    );


                    if (
                        !response.ok ||
                        !result.success
                    ) {

                        alert(
                            result.message ||
                            "Unable to send message."
                        );

                        return;

                    }


                    /* CLEAR INPUT */

                    messageInput.value =
                        "";


                    /* RELOAD CHAT */

                    await loadMessages(
                        currentReceiverId
                    );


                } catch (error) {

                    console.error(
                        "Send message error:",
                        error
                    );


                    alert(
                        "Unable to send message. Please try again."
                    );

                }

            }
        );


        /* =====================================================
           START
        ===================================================== */

        loadConversations();

    </script>

</body>

</html>
